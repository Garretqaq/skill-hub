name: docker-build-push

on:
  push:
    branches:
      - "master"
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      REGISTRY: 'registry.cn-hangzhou.aliyuncs.com'
      IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/dato/skill-hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,enable=true,priority=600,prefix=,suffix=,event=tag
            type=ref,enable=true,priority=500,prefix=,suffix=,event=branch
            type=sha,enable=true,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_ENV=production

      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "DEPLOY_WEBHOOK secret not set, skipping deploy trigger"
            exit 0
          fi
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"$IMAGE\",\"tag\":\"$TAG\",\"sha\":\"$SHA\"}" \
            "$DEPLOY_WEBHOOK"

